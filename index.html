<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embajadores · Esencia Paradise 2026</title>
  <link rel="icon" href="https://esenciaparadise.com/wp-content/uploads/2025/10/IMG_6016.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #F0D080; --gold-light: #FAE8A8; --gold-bright: #FFF4D4;
      --bronze: #DEB060; --bronze-dark: #9A7030;
      --dark-0: #080305; --card-bg: rgba(255,220,140,.08);
      --border: rgba(240,208,128,.45); --border-focus: rgba(222,176,96,.90);
      --text-muted: rgba(240,208,128,.85);
      --radius-card: 18px; --radius-input: 10px; --radius-btn: 999px; --tr: .25s ease;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background-color:var(--dark-0);color:var(--gold);font-family:'Montserrat',system-ui,Arial,sans-serif;font-size:15px;line-height:1.6;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
    @keyframes bg-drift{0%{transform:scale(1) translate(0%,0%);opacity:1}25%{transform:scale(1.06) translate(-2.5%,1.5%);opacity:.92}50%{transform:scale(1.10) translate(-4%,3%);opacity:.85}75%{transform:scale(1.06) translate(-2%,1.5%);opacity:.92}100%{transform:scale(1) translate(0%,0%);opacity:1}}
    @keyframes gold-sweep{0%{transform:translateX(0%) translateY(0%);opacity:1}33%{transform:translateX(4%) translateY(-3%);opacity:.70}66%{transform:translateX(-3%) translateY(4%);opacity:.85}100%{transform:translateX(0%) translateY(0%);opacity:1}}
    body::before{content:'';position:fixed;inset:-10%;background:radial-gradient(ellipse 75% 65% at 105% 55%,rgba(110,8,8,.80) 0%,rgba(70,5,5,.45) 45%,transparent 70%),radial-gradient(ellipse 50% 40% at 100% 100%,rgba(80,5,5,.55) 0%,transparent 55%),radial-gradient(ellipse 40% 35% at 0% 100%,rgba(60,4,4,.30) 0%,transparent 55%);pointer-events:none;z-index:0;animation:bg-drift 18s ease-in-out infinite;will-change:transform,opacity}
    body::after{content:'';position:fixed;inset:-10%;background:linear-gradient(135deg,transparent 38%,rgba(212,175,106,.07) 39%,rgba(212,175,106,.18) 39.5%,rgba(212,175,106,.07) 40%,transparent 41%);pointer-events:none;z-index:0;animation:gold-sweep 24s ease-in-out infinite;will-change:transform,opacity}
    header{width:100%;padding:2.5rem 2rem 1.2rem;display:flex;flex-direction:column;align-items:center;gap:.55rem;position:relative;z-index:1}
    .logo-wrap img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 0 28px rgba(212,175,106,.5)) drop-shadow(0 0 8px rgba(212,175,106,.25))}
    .eyebrow{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--bronze);font-weight:400;text-align:center;padding-left:.26em}
    @keyframes shimmer{0%{background-position:-250% center}100%{background-position:250% center}}
    header h1{font-family:'Cinzel',serif;font-size:clamp(1.4rem,3.8vw,2rem);font-weight:700;text-align:center;background:linear-gradient(135deg,var(--gold-bright) 0%,var(--gold) 40%,var(--bronze) 70%,var(--gold-light) 100%);background-size:250% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 6s linear infinite;line-height:1.25;letter-spacing:.05em}
    .header-sub{font-family:'Montserrat',sans-serif;font-size:.84rem;color:var(--text-muted);text-align:center;max-width:400px;line-height:1.65;margin-top:.1rem;opacity:.80}
    main{width:100%;max-width:500px;padding:.8rem 1.5rem 5rem;position:relative;z-index:1}
    .form-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-card);padding:clamp(1.8rem,5vw,2.6rem);box-shadow:0 32px 80px rgba(0,0,0,.5),0 0 0 1px rgba(226,192,122,.10) inset,inset 0 1px 0 rgba(226,192,122,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.2rem}
    .field:last-of-type{margin-bottom:0}
    label{font-family:'Cinzel',serif;font-size:.76rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);transition:color var(--tr)}
    .field:focus-within label{color:var(--bronze)}
    input[type="text"],input[type="email"]{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius-input);color:var(--gold-light);font-family:'Montserrat',inherit;font-size:.95rem;padding:.9rem 1.1rem;outline:none;transition:border-color var(--tr),box-shadow var(--tr),background var(--tr);-webkit-appearance:none}
    input::placeholder{color:rgba(212,175,106,.22)}
    input:focus{border-color:var(--border-focus);background:rgba(107,10,10,.08);box-shadow:0 0 0 3px rgba(184,135,58,.10)}
    .req{color:#f87171;margin-left:3px}
    .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,106,.12),transparent);margin:1.6rem 0}
    .btn-submit{width:100%;padding:1.1rem 2rem;background:linear-gradient(105deg,#9A7030 0%,#DEB060 45%,#F0D080 75%,#FFF4D4 100%);background-size:220% 100%;background-position:100% 0;border:none;border-radius:var(--radius-btn);color:#1a0a02;font-family:'Cinzel',serif;font-size:.90rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background-position .45s ease,box-shadow .3s ease,transform .15s ease;box-shadow:0 14px 36px rgba(0,0,0,.75),0 0 0 1px rgba(212,175,106,.12) inset;position:relative;overflow:hidden;margin-top:1.6rem;display:flex;align-items:center;justify-content:center;gap:.55rem}
    .btn-submit::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:translateX(-100%);transition:transform .55s ease}
    .btn-submit:hover{background-position:0% 0;transform:translateY(-1px);box-shadow:0 18px 48px rgba(0,0,0,.85)}
    .btn-submit:hover::after{transform:translateX(100%)}
    .btn-submit:active{transform:translateY(0)}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .wa-icon{width:17px;height:17px;flex-shrink:0}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(26,10,2,.3);border-top-color:#1a0a02;border-radius:50%;animation:spin .65s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-msg{display:none;background:rgba(107,10,10,.22);border:1px solid rgba(107,10,10,.5);border-radius:8px;color:#e87575;font-size:.8rem;padding:.7rem 1rem;margin-top:1rem;text-align:center}
    .error-msg.show{display:block}
    .disclaimer{font-family:'Montserrat',sans-serif;font-size:.72rem;color:rgba(240,208,128,.38);text-align:center;margin-top:1rem;line-height:1.55}
    footer{position:relative;z-index:1;padding:1.5rem 1rem 2rem;text-align:center;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.15em;color:rgba(240,208,128,.40)}
    footer a{color:rgba(240,208,128,.52);text-decoration:none}
    @media(max-width:480px){.eyebrow{font-size:.60rem;letter-spacing:.10em}}
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <img src="https://esenciaparadise.com/wp-content/uploads/2025/10/IMG_6016.png" alt="Esencia Paradise" width="120" height="120" />
    </div>
    <p class="eyebrow">International Bachata Congress &middot; Barcelona 2026</p>
    <h1>Programa de Embajadores</h1>
    <p class="header-sub">D&eacute;janos tus datos y en segundos te conectamos con nuestro equipo por WhatsApp.</p>
  </header>

  <main>
    <div class="form-card">
      <div class="field">
        <label for="nombre">Nombre completo <span class="req">*</span></label>
        <input type="text" id="nombre" placeholder="Tu nombre completo" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" placeholder="tu@email.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="web">Web de tu negocio <span class="req">*</span></label>
        <input type="text" id="web" placeholder="https://tuwebsite.com" autocomplete="off" required />
      </div>
      <div class="field">
        <label for="redes">Instagram / Redes sociales <span class="req">*</span></label>
        <input type="text" id="redes" placeholder="@tuusuario" autocomplete="off" required />
      </div>
      <div class="field">
        <label for="ciudad">Ciudad / Pa&iacute;s</label>
        <input type="text" id="ciudad" placeholder="ej: Barcelona, Espa&ntilde;a" autocomplete="off" />
      </div>
      <div class="divider"></div>
      <button class="btn-submit" id="btn-submit" onclick="handleSubmit()">
        <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Hablar con nosotros
      </button>
      <div class="error-msg" id="form-error"></div>
      <p class="disclaimer">Al continuar ser&aacute;s redirigido a WhatsApp para hablar con nuestro equipo.</p>
    </div>
  </main>

  <footer>
    &copy; 2026 Esencia Paradise &middot; Barcelona &middot;
    <a href="https://esenciaparadise.com" target="_blank" rel="noopener">esenciaparadise.com</a>
  </footer>

  <script>
    var WEBHOOK = 'https://esencia-paradise-n8n.rh6pum.easypanel.host/webhook/b8600a5f-dfb1-4d58-a9e7-019a73ce28a0';

    function showError(msg) {
      var el = document.getElementById('form-error');
      el.textContent = msg;
      el.classList.add('show');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function hideError() {
      document.getElementById('form-error').classList.remove('show');
    }

    function handleSubmit() {
      hideError();
      var nombre = document.getElementById('nombre').value.trim();
      var email  = document.getElementById('email').value.trim();
      var redes  = document.getElementById('redes').value.trim();
      var ciudad = document.getElementById('ciudad').value.trim();
      var web    = document.getElementById('web').value.trim();

      if (!nombre) { showError('El nombre completo es obligatorio.'); return; }
      if (!email)  { showError('El email es obligatorio.'); return; }
      if (!/\S+@\S+\.\S+/.test(email)) { showError('Introduce un email válido.'); return; }
      if (!web)    { showError('La web de tu negocio es obligatoria.'); return; }
      if (!redes)  { showError('Instagram / Redes sociales es obligatorio.'); return; }

      var btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Conectando...';

      var params = new URLSearchParams({
        nombre: nombre, email: email,
        redes_sociales: redes, ciudad_pais: ciudad, web: web,
        empresa: '', tipo_publico: '', comunidad_activa: '',
        plataformas: '', ha_promocionado: '', tipo_eventos: '',
        entradas_por_evento: '', experiencia_afiliado: '',
        capacidad_venta: '', estrategia_venta: '', motivacion: '',
        dispuesto_a_promocionar: '', tiempo_dedicacion: '',
        plan_20_tickets: '', extra: '',
        fecha_envio: new Date().toISOString()
      });

      window.location.href = WEBHOOK + '?' + params.toString();
    }
  </script>
</body>
</html>
